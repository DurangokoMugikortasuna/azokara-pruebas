const W=[["Kurutziaga kalea", "Calle Kurutziaga", "1937ko martxoaren 31n, goizeko zortzi eta erdiak aldera, Italiako hegazkinek Durango bonbardatu zuten. Lehen bonbak Kurutziaga kalean erori ziren, eta gurutzea lurrera bota zuten. Arratsaldean hiribilduak beste eraso bat jasan zuen.", "El 31 de marzo de 1937, hacia las ocho y media de la mañana, aviones italianos bombardearon Durango. Los primeros proyectiles cayeron en Kurutziaga y derribaron la cruz. Por la tarde la villa sufrió otro ataque.", "", "", "Kurutziaga kalea, Durango"], ["Uribarriko Andra Mari", "Santa María de Uribarri", "Bonbardaketa hasi zenean, basilikan meza ematen ari ziren eta elizpean merkatua zegoen. Eguneroko jardueretan ari ziren herritarrak izan ziren erasoaren biktimak. Tenplua eta elizpea oso kaltetuta geratu ziren, eta gerra ostean berreraiki zituzten.", "Cuando comenzó el bombardeo se celebraba misa en la basílica y había mercado en el pórtico. Entre las víctimas había personas que realizaban sus actividades cotidianas. El templo y el pórtico quedaron gravemente dañados y fueron reconstruidos tras la guerra.", "", "", "Basílica Santa María de Uribarri, Durango"], ["Bonbardaketaren aztarnak", "Huellas del bombardeo", "Kurutziaga kaleko Garai jauregiaren fatxadan metrailak utzitako zuloak ikus daitezke oraindik. Harrian geratutako arrasto horiek 1937ko bonbardaketaren lekuko dira.", "En la fachada del palacio Garai, en Kurutziaga, aún se pueden observar los impactos de metralla. Estas marcas en la piedra son testimonios materiales del bombardeo de 1937.", "", "", "Palacio Garai, Kurutziaga, Durango, Bizkaia"], ["Memoria eta bakea", "Memoria y paz", "Oroitarri batek Durangoko bonbardaketaren biktimak gogorarazten ditu. Aztarnak ibilbideak gerrarekin lotutako beste toki batzuk ere jasotzen ditu, hala nola kanpaina-ospitalea eta emakumeen kartzela egon ziren lekuak. Memoria historikoak herritarren bizipenak ezagutzen laguntzen digu.", "Un memorial recuerda a las víctimas del bombardeo de Durango. El itinerario Aztarnak también recoge otros lugares relacionados con la guerra, como los emplazamientos del hospital de campaña y la cárcel de mujeres. La memoria histórica nos ayuda a conocer las experiencias de la población civil.", "", "", "Espacio de la Memoria, Kurutziaga, Durango, Bizkaia"]];const H=[["Durangoko harresiak sei ate zituen, eta Santa Anakoa da gaur egun zutik dirauen bakarra. Handik igarotzen ziren kostaldeko arraina eta barrualdeko ardoa garraiatzen zituzten merkatariak. Gaur ikusten dugun arkuak XVIII. mendean hartu zuen bere itxura barrokoa. Ondoko eliza ere estilo barrokokoa da.","La muralla de Durango tenía seis puertas, y la de Santa Ana es la única que sigue en pie. Por ella pasaban los comerciantes que transportaban pescado de la costa y vino del interior. El arco adquirió su aspecto barroco en el siglo XVIII. La iglesia de al lado también es barroca."],["Isabel Katolikoak hemen gaua igaro zuela uste da, XV. mendearen amaieran foruak zin egitera etorri zenean. Fatxadan harriz zizelkatutako irudi bitxiak daude. XIX. mendean jauregia kartzela bihurtu zuten, eta beheko aldean burdin hesien arrastoak ikus daitezke oraindik.","Se cree que Isabel la Católica pasó aquí la noche a finales del siglo XV, cuando vino a jurar los fueros. La fachada tiene curiosas figuras talladas en piedra. En el siglo XIX el palacio se convirtió en cárcel y en la parte inferior todavía se distinguen las huellas de las rejas."],["Durangoko udaletxearen fatxada ezohiko margolanez apainduta dago. XVIII. mendeko margolanek irudiz apaindutako arkitekturak eta eszenak erakusten dituzte. 1937ko bonbardaketak eraikina kaltetu zuen, eta gerra ostean margolanak berreskuratu zituzten.","La fachada del Ayuntamiento de Durango está decorada con pinturas poco habituales. Sus pinturas del siglo XVIII representan arquitecturas fingidas y escenas figurativas. El bombardeo de 1937 dañó el edificio y las pinturas se recuperaron después de la guerra."],["Uribarriko Andra Mariren elizpea Euskal Herriko zurezko elizperik handienetako bat da. Durangoko lehen Liburu eta Disko Azoka 1965ean elizpe honetan egin zen. Teilatuari eusteko, egurrezko egitura hamaika zutabe, bederatzi pilastra eta basilikaren bi hormaren gainean bermatzen da. 1937ko bonbardaketan ia erabat suntsitu zuten, eta gerra ostean berreraiki zuten.","El pórtico de Santa María de Uribarri es uno de los pórticos de madera más grandes de Euskal Herria. Su estructura descansa sobre once columnas, nueve pilastras y dos muros de la basílica. Quedó casi completamente destruido en el bombardeo de 1937 y fue reconstruido tras la guerra."],["Kurutziagako gurutzea lau metrotik gorako harrizko kontakizuna da. Behetik gora irakurrita, bekatutik salbaziora doan istorioa azaltzen du. Durangoko heretikoekin eta haien aurkako errepresioarekin lotu izan da, baina haren jatorria ez dago guztiz argituta.","La cruz de Kurutziaga es una historia tallada en piedra de más de cuatro metros de altura. Sus figuras narran, de abajo arriba, el paso del pecado a la salvación. Se ha relacionado con los herejes de Durango y su represión, aunque su origen no está completamente aclarado."],["Ezkurdi plazaren azpian arte-erakusketa areto bat dago. 1970 eta 1971 artean plaza berritu zutenean sortu zuten. Hasieran Gerediaga Elkarteak kudeatu zuen, Durangoko Azoka antolatzen duen elkarte berak.","Bajo la plaza Ezkurdi se esconde una sala de exposiciones de arte, creada durante la reforma de la plaza entre 1970 y 1971. Su gestión inicial estuvo a cargo de Gerediaga Elkartea, la misma asociación que organiza la Durangoko Azoka."],["Eraikin bakarra dirudien arren, bi tenpluk osatzen dute multzoa: San Pedro elizak eta hari erantsitako Errosarioko ermitak. Tokiko tradizioaren arabera, San Pedro Bizkaiko elizarik zaharrenetako bat da; gaur egungo eraikinak, ordea, hainbat garaitako aztarnak gordetzen ditu.","Aunque parece un único edificio, el conjunto reúne dos templos: San Pedro y la ermita del Rosario, adosada a la iglesia. La tradición local considera San Pedro una de las iglesias más antiguas de Bizkaia, aunque el edificio actual conserva elementos de diferentes épocas."],["San Agustin Kultur Gunea antzokia XVII. mendean agustindarrek eraikitako komentu zaharrean dago. Gaur egun, antzerkia, musika eta dantza eskaintzen ditu, eta SAREA-Euskadiko Antzokien Sareko kidea da.","El teatro San Agustin Kultur Gunea ocupa un antiguo convento construido por los agustinos en el siglo XVII. Hoy acoge teatro, música y danza, y forma parte de SAREA, la Red Vasca de Teatros."],["Pinondo izenak pinu bati egiten dio erreferentzia. Erdi Aroko agirien arabera, haren azpian justizia ematen zen. Gaur hemen ikus daitekeen Pablo Pedro Astarloa hizkuntzalariaren estatua, berriz, Ezkurdin inauguratu zuten 1886an.","El nombre Pinondo alude a un pino. Según documentos medievales, bajo él se impartía justicia. La estatua del lingüista Pablo Pedro Astarloa que hoy vemos en esta plaza se inauguró originalmente en Ezkurdi en 1886."],["Durangoko Arte eta Historia Museoa Etxezarreta jauregian dago, Sanagustinalden. Durangoko Udalak 1984an erosi zuen eraikina, eta museoak 1986ko ekainaren 13an ireki zituen ateak. Lehen solairuan herriko historia ezagutu daiteke; hirugarrenean, euskal arte garaikidearen bilduma dago. Beste solairu batzuetan aldi baterako erakusketak egiten dira.","El Museo de Arte e Historia de Durango se encuentra en el palacio Etxezarreta, en Sanagustinalde. El Ayuntamiento adquirió el edificio en 1984 y el museo abrió sus puertas el 13 de junio de 1986. La primera planta recorre la historia de Durango; la tercera alberga una colección de arte vasco contemporáneo. Otras plantas acogen exposiciones temporales."]];

function locatePickupOnMap(btn){

  btn.disabled=false;btn.textContent='◎';if(!pickupMap||$('manualPanel').hidden)return;

let leafletLoading=null;function loadLeafletLibrary(){if(typeof L!=='undefined')return Promise.resolve();if(leafletLoading)return leafletLoading;leafletLoading=new Promise((ok,no)=>{const l=document.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';const timer=setTimeout(()=>{s.remove();l.remove();no(Error('timeout'))},12000);let jsReady=false,cssReady=false;const ready=()=>{if(jsReady&&cssReady){clearTimeout(timer);ok()}};const error=()=>{clearTimeout(timer);s.remove();l.remove();no(Error('leaflet'))};s.onload=()=>{jsReady=true;ready()};l.onload=()=>{cssReady=true;ready()};s.onerror=l.onerror=error;document.head.append(l,s)}).catch(e=>{leafletLoading=null;throw e});return leafletLoading}

ment.getElementById('heritageGoogleFallback').hidden);if(!hmap){hmap=L.map('heritageMap').setView([43.167,-2.631],15);addBaseMap(hmap,'mapStatus');hLayer=L.layerGroup().addTo(hmap);hereLayer=L.layerGroup().addTo(hmap)}hmap.invalidateSize();hLayer.clearLayers();hereLayer.clearLayers();for(const p of places){const m=L.marker([p[2],p[3]],{title:mapName(p),icon:L.divIcon({className:'heritageMarker',html:p[0]==='hist'?'H':'M',iconSize:[32,32],iconAnchor:[16,16]})}).addTo(hLayer);m.getElement().style.background=p[0]==='hist'?'#806321':'#565C5D';const content=document.createElement('div');const label=document.createElement('strong');label.textContent=mapName(p);const b=document.createElement('button');b.textContent=msg('Fitxa ireki','Abrir ficha');b.style.cssText='display:block;margin-top:8px;min-height:44px';b.onclick=()=>openMapCard(p);content.append(label,b);m.bindPopup(content)}if(here){L.circleMarker(here,{radius:8,color:'#fff',weight:3,fillColor:'#1769c2',fillOpacity:1}).addTo(hereLayer);hmap.setView(here,16)}else hmap.fitBounds(places.map(p=>[p[2],p[3]]),{padding:[25,25],maxZoom:16});}
